<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc"><title id="title">三个执行入口，一个共享内核</title><desc id="desc">桌面托管、独立工作与渠道桥接，各自保留生命周期。</desc><metadata data-source="docs/diagrams/sources/runtime-architecture-zh.mmd" data-source-sha256="ef2f40d87c80123e40a9d6c04fbe437fa20850ea07140cd4d33b6d0518bbbda9">flowchart TB
    accTitle: Ackem 运行时与进程边界
    accDescr: 桌面托管、独立工作和渠道桥接通过不同宿主入口连接同一内核，数据存储与执行分别管理。

    desktop_ui["桌面界面&lt;br/&gt;Electron · React"]
    channel_input["QQ / 微信"]
    ackem_host["Ackem 主进程&lt;br/&gt;上下文与路由"]
    managed_tasks["托管任务&lt;br/&gt;契约 · 监督 · 验收"]
    extension_runtime["已启用扩展&lt;br/&gt;Skill · Plugin"]
    independent_work["独立工作&lt;br/&gt;私有会话与队列"]
    channel_bridge["渠道代码桥接&lt;br/&gt;机主与远程授权"]
    kernel_service[["AckemCode 服务&lt;br/&gt;智能体循环与工具"]]
    app_storage[("Ackem 数据&lt;br/&gt;记忆 · 历史 · 任务状态")]
    real_resources["真实资源&lt;br/&gt;文件 · 终端 · 外部服务"]

    desktop_ui --&gt;|"IPC"| ackem_host
    desktop_ui --&gt;|"IPC"| independent_work
    channel_input --&gt; channel_bridge
    ackem_host --&gt;|"work"| managed_tasks
    ackem_host --&gt;|"plugin"| extension_runtime
    ackem_host -.-&gt; app_storage
    managed_tasks &lt;--&gt;|"HTTP / SSE"| kernel_service
    independent_work --&gt; kernel_service
    channel_bridge --&gt; kernel_service
    kernel_service --&gt; real_resources

    classDef neutral fill:#f3f4f6,stroke:#6b7280,stroke-width:1.4px,color:#1f2937
    classDef primary fill:#dbeafe,stroke:#2563eb,stroke-width:1.6px,color:#1e3a5f
    classDef accent fill:#ede9fe,stroke:#7c3aed,stroke-width:1.6px,color:#3b0764
    classDef success fill:#dcfce7,stroke:#16a34a,stroke-width:1.6px,color:#14532d
    class desktop_ui,channel_input,app_storage neutral
    class ackem_host,managed_tasks,extension_runtime,independent_work,channel_bridge primary
    class kernel_service accent
    class real_resources success</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7488a2"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="1198" height="968" rx="28" fill="#f8fafc" stroke="#dbe4ef"/>
