<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc"><title id="title">Three entry paths, one shared kernel</title><desc id="desc">Managed work, independent sessions and channel dispatch retain distinct lifecycles.</desc><metadata data-source="docs/diagrams/sources/runtime-architecture-en.mmd" data-source-sha256="f372a2b15abfa955dbbd50d4a5122e454dc37d1d674bfd86f1058b76839928ae">flowchart TB
    accTitle: Ackem Runtime Process Boundaries
    accDescr: Desktop, independent work and channel adapters connect to the same kernel through different host paths. Storage is separate from execution.

    desktop_ui["Desktop UI&lt;br/&gt;Electron · React"]
    channel_input["QQ / WeChat"]
    ackem_host["Ackem main process&lt;br/&gt;Context and routing"]
    managed_tasks["Managed tasks&lt;br/&gt;Contracts · supervision · acceptance"]
    extension_runtime["Enabled extensions&lt;br/&gt;Skill · Plugin"]
    independent_work["Independent work&lt;br/&gt;Private session and queue"]
    channel_bridge["Channel code bridge&lt;br/&gt;Owner and remote permission"]
    kernel_service[["AckemCode service&lt;br/&gt;Agent loop and tools"]]
    app_storage[("Ackem storage&lt;br/&gt;Memory · history · task state")]
    real_resources["Real resources&lt;br/&gt;Files · terminal · external services"]

    desktop_ui --&gt;|"IPC"| ackem_host
    desktop_ui --&gt;|"IPC"| independent_work
    channel_input --&gt; channel_bridge
    ackem_host --&gt;|"work"| managed_tasks
    ackem_host --&gt;|"plugin"| extension_runtime
    ackem_host -.-&gt; app_storage
    managed_tasks &lt;--&gt;|"HTTP / SSE"| kernel_service
    independent_work --&gt; kernel_service
    channel_bridge --&gt; kernel_service
    kernel_service --&gt; real_resources

    classDef neutral fill:#f3f4f6,stroke:#6b7280,stroke-width:1.4px,color:#1f2937
    classDef primary fill:#dbeafe,stroke:#2563eb,stroke-width:1.6px,color:#1e3a5f
    classDef accent fill:#ede9fe,stroke:#7c3aed,stroke-width:1.6px,color:#3b0764
    classDef success fill:#dcfce7,stroke:#16a34a,stroke-width:1.6px,color:#14532d
    class desktop_ui,channel_input,app_storage neutral
    class ackem_host,managed_tasks,extension_runtime,independent_work,channel_bridge primary
    class kernel_service accent
    class real_resources success</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8299b6"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="1198" height="968" rx="28" fill="#0b1220" stroke="#30425c"/>
