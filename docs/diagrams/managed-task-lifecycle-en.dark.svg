<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">From a goal to an accepted result</title><desc id="desc">Execution, acceptance and delivery are recorded separately.</desc><metadata data-source="docs/diagrams/sources/managed-task-lifecycle-en.mmd" data-source-sha256="f6c6a4cece5946ae1f3290514bff9ebe2fc7cb1c9678bbd4c0ea808f4daf84b8">flowchart TB
    accTitle: Managed Task Execution And Acceptance
    accDescr: A durable contract governs execution. Receipts feed acceptance; rework returns to the kernel and accepted results enter delivery.

    task_request(["User goal or amendment"])
    task_contract["TaskCoordinator&lt;br/&gt;Goal and contract"]
    task_repository[("TaskRepository&lt;br/&gt;Revisions · authority · queue")]
    kernel_execution[["AckemCode&lt;br/&gt;Execute under current authority"]]
    execution_receipt["Tool results and receipts"]
    acceptance_review{"Meets the current goal?"}
    delivery_outbox["Notification outbox&lt;br/&gt;Deduplicate and publish"]
    final_delivery(["Result delivered"])

    task_request --&gt; task_contract
    task_contract --&gt; task_repository
    task_repository --&gt; kernel_execution
    kernel_execution --&gt; execution_receipt
    execution_receipt --&gt; acceptance_review
    acceptance_review --&gt;|"Rework"| kernel_execution
    acceptance_review --&gt;|"Accepted"| delivery_outbox
    delivery_outbox --&gt; final_delivery

    classDef neutral fill:#f3f4f6,stroke:#6b7280,stroke-width:1.4px,color:#1f2937
    classDef primary fill:#dbeafe,stroke:#2563eb,stroke-width:1.6px,color:#1e3a5f
    classDef accent fill:#ede9fe,stroke:#7c3aed,stroke-width:1.6px,color:#3b0764
    classDef success fill:#dcfce7,stroke:#16a34a,stroke-width:1.6px,color:#14532d
    class task_request neutral
    class task_contract,task_repository,acceptance_review primary
    class kernel_execution,execution_receipt accent
    class delivery_outbox,final_delivery success</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8299b6"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="1198" height="788" rx="28" fill="#0b1220" stroke="#30425c"/>
