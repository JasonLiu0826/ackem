<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc"><title id="title">从目标到结果的任务闭环</title><desc id="desc">执行、验收与交付分别记录，返工始终围绕当前目标。</desc><metadata data-source="docs/diagrams/sources/managed-task-lifecycle-zh.mmd" data-source-sha256="d109fb447a92f9f7e95f33abe299cd5084feba96fd3556f991fdcc19ac00f0e4">flowchart TB
    accTitle: 托管任务执行与验收
    accDescr: 持久契约约束执行，回执进入验收；需要返工时返回内核，验收后的结果进入交付。

    task_request(["用户目标或补充"])
    task_contract["TaskCoordinator&lt;br/&gt;目标与契约"]
    task_repository[("TaskRepository&lt;br/&gt;修订 · 授权 · 队列")]
    kernel_execution[["AckemCode&lt;br/&gt;按当前授权执行"]]
    execution_receipt["工具结果与回执"]
    acceptance_review{"满足当前目标？"}
    delivery_outbox["通知 Outbox&lt;br/&gt;去重与发布"]
    final_delivery(["结果交付"])

    task_request --&gt; task_contract
    task_contract --&gt; task_repository
    task_repository --&gt; kernel_execution
    kernel_execution --&gt; execution_receipt
    execution_receipt --&gt; acceptance_review
    acceptance_review --&gt;|"返工"| kernel_execution
    acceptance_review --&gt;|"通过"| delivery_outbox
    delivery_outbox --&gt; final_delivery

    classDef neutral fill:#f3f4f6,stroke:#6b7280,stroke-width:1.4px,color:#1f2937
    classDef primary fill:#dbeafe,stroke:#2563eb,stroke-width:1.6px,color:#1e3a5f
    classDef accent fill:#ede9fe,stroke:#7c3aed,stroke-width:1.6px,color:#3b0764
    classDef success fill:#dcfce7,stroke:#16a34a,stroke-width:1.6px,color:#14532d
    class task_request neutral
    class task_contract,task_repository,acceptance_review primary
    class kernel_execution,execution_receipt accent
    class delivery_outbox,final_delivery success</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7488a2"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="1198" height="788" rx="28" fill="#f8fafc" stroke="#dbe4ef"/>
