<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">chat / plugin / work routing</title><desc id="desc">Ackem selects how to handle a request; work delegates execution to AckemCode.</desc><metadata data-source="docs/diagrams/sources/request-routing-en.mmd" data-source-sha256="24470ac681a0f7f5dea86953f701d52d35e3cdac298ed121c2a74856857fe81b">flowchart TB
    accTitle: Ackem chat plugin work routing
    accDescr: Desktop chat selects among three handling modes using intent, recent conversation and enabled capabilities. Chat produces content, plugin invokes an actual extension, and work delegates to AckemCode with receipts, artifacts and acceptance. These are not sequential steps or proof of completion.

    request(["Your request"])
    router["Ackem semantic routing&lt;br/&gt;Current intent + recent conversation + enabled capabilities"]
    chat["chat · Conversation&lt;br/&gt;Content and ordinary chat tools"]
    plugin["plugin · Capability&lt;br/&gt;Validate and invoke an enabled extension"]
    work["work · Execution&lt;br/&gt;Inspect, change and deliver real resources&lt;br/&gt;Including read-only checks and plugin creation or updates"]
    chat_reply["Conversation reply&lt;br/&gt;Text · explanations · plans"]
    extension_runtime["Extension runtime&lt;br/&gt;Actual capability call and receipt"]
    kernel[["AckemCode general-purpose agent kernel&lt;br/&gt;Files · commands · web · documents"]]
    delivery(["Ackem checks and delivers the result&lt;br/&gt;Reply claims must match actual execution state"])

    request --&gt; router
    router --&gt;|"Respond"| chat
    router --&gt;|"Use a capability"| plugin
    router --&gt;|"Act on resources"| work
    chat --&gt; chat_reply
    plugin --&gt; extension_runtime
    work --&gt; kernel
    chat_reply --&gt;|"Content"| delivery
    extension_runtime --&gt;|"Extension receipt"| delivery
    kernel --&gt;|"Receipts · artifacts · acceptance"| delivery

    classDef neutral fill:#f3f4f6,stroke:#6b7280,stroke-width:1.4px,color:#1f2937
    classDef primary fill:#dbeafe,stroke:#2563eb,stroke-width:1.6px,color:#1e3a5f
    classDef accent fill:#ede9fe,stroke:#7c3aed,stroke-width:1.6px,color:#3b0764
    classDef success fill:#dcfce7,stroke:#16a34a,stroke-width:1.6px,color:#14532d
    class request neutral
    class router,chat,plugin,work,chat_reply,extension_runtime primary
    class kernel accent
    class delivery success</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7488a2"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="1198" height="1058" rx="28" fill="#f8fafc" stroke="#dbe4ef"/>
