<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">chat / plugin / work 三级路由</title><desc id="desc">Ackem 理解请求，选择内容回应、扩展调用或真实任务执行。</desc><metadata data-source="docs/diagrams/sources/request-routing-zh.mmd" data-source-sha256="18a8f9034270f7c0267cac27e333333b4829e93e37ca9970d07154b2e5c37587">flowchart TB
    accTitle: Ackem chat plugin work 三级路由
    accDescr: 桌面主聊天按意图、最近对话和已启用能力选择三种处理方式。chat 生成内容，plugin 调用实际扩展，work 由 AckemCode 执行并核对回执、产物和验收。这不是串行步骤，分类不代表完成。

    request(["用户请求"])
    router["Ackem 语义路由&lt;br/&gt;本轮意图 ＋ 最近对话 ＋ 已启用能力"]
    chat["chat · 对话&lt;br/&gt;解释与内容回应，可用普通聊天工具"]
    plugin["plugin · 能力调用&lt;br/&gt;核验并使用已启用扩展"]
    work["work · 任务执行&lt;br/&gt;真实资源调查、修改与交付&lt;br/&gt;只读检查、创建或修改插件也走这里"]
    chat_reply["内容回应&lt;br/&gt;正文 · 解释 · 方案"]
    extension_runtime["扩展运行时&lt;br/&gt;实际调用，取得回执"]
    kernel[["AckemCode 通用智能体内核&lt;br/&gt;文件 · 命令 · 网络 · 文档"]]
    delivery(["Ackem 核对结果并交付&lt;br/&gt;回复结论应与真实执行状态一致"])

    request --&gt; router
    router --&gt;|"直接回应"| chat
    router --&gt;|"现有能力"| plugin
    router --&gt;|"真实资源"| work
    chat --&gt; chat_reply
    plugin --&gt; extension_runtime
    work --&gt; kernel
    chat_reply --&gt;|"正文结果"| delivery
    extension_runtime --&gt;|"扩展回执"| delivery
    kernel --&gt;|"回执 · 产物 · 验收"| delivery

    classDef neutral fill:#f3f4f6,stroke:#6b7280,stroke-width:1.4px,color:#1f2937
    classDef primary fill:#dbeafe,stroke:#2563eb,stroke-width:1.6px,color:#1e3a5f
    classDef accent fill:#ede9fe,stroke:#7c3aed,stroke-width:1.6px,color:#3b0764
    classDef success fill:#dcfce7,stroke:#16a34a,stroke-width:1.6px,color:#14532d
    class request neutral
    class router,chat,plugin,work,chat_reply,extension_runtime primary
    class kernel accent
    class delivery success</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7488a2"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="1198" height="1058" rx="28" fill="#f8fafc" stroke="#dbe4ef"/>
