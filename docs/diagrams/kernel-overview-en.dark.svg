<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">AckemCode general-purpose agent kernel</title><desc id="desc">Shared sessions, agent loops and tools support multiple entry paths.</desc><metadata data-source="docs/diagrams/sources/kernel-overview-en.mmd" data-source-sha256="253acada6feec456524e87ec5d338563e9d6252291f80ce71e3ed88d077f8571">flowchart TB
    accTitle: AckemCode General Purpose Agent Kernel
    accDescr: Host-managed work, independent sessions and CLI use the same agent kernel. Permission and receipt boundaries surround actual tool execution.

    host_entry["Ackem managed work"]
    standalone_entry["Independent work / CLI / Web"]
    kernel_session["Session and context&lt;br/&gt;Goal · history · model"]
    agent_loop[["Agent loop&lt;br/&gt;Plan · act · inspect"]]
    permissions["Permissions and interaction"]
    local_tools["Local tools&lt;br/&gt;Files · commands · documents"]
    external_tools["Integrations&lt;br/&gt;Web · MCP · LSP · skills"]
    kernel_receipts["Events · receipts · artifacts"]
    host_acceptance["Host review and delivery"]

    host_entry --&gt; kernel_session
    standalone_entry --&gt; kernel_session
    kernel_session --&gt; agent_loop
    agent_loop --&gt; permissions
    permissions --&gt; local_tools
    permissions --&gt; external_tools
    local_tools --&gt; kernel_receipts
    external_tools --&gt; kernel_receipts
    kernel_receipts -.-&gt;|"Continue when needed"| agent_loop
    kernel_receipts --&gt; host_acceptance

    classDef primary fill:#dbeafe,stroke:#2563eb,stroke-width:1.6px,color:#1e3a5f
    classDef neutral fill:#f3f4f6,stroke:#6b7280,stroke-width:1.4px,color:#1f2937
    classDef accent fill:#ede9fe,stroke:#7c3aed,stroke-width:1.6px,color:#3b0764
    classDef success fill:#dcfce7,stroke:#16a34a,stroke-width:1.6px,color:#14532d
    class host_entry,local_tools,external_tools primary
    class standalone_entry neutral
    class kernel_session,agent_loop,permissions accent
    class kernel_receipts,host_acceptance success</metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8299b6"/></marker></defs><g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><rect x="1" y="1" width="1198" height="958" rx="28" fill="#0b1220" stroke="#30425c"/>
